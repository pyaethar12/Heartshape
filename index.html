<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Lights</title>
<style>
:root{color-scheme:dark;--bg:#0b0709;--fg:#f4e9ec;--muted:#9a8890;--rose:#ff3d6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1c1017 0%,var(--bg) 60%);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;box-sizing:border-box;overflow:hidden}
header{text-align:center}
h1{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:300;letter-spacing:.32em;text-transform:uppercase;margin:0 0 6px;padding-left:.32em}
.sub{margin:0;font-size:.82rem;color:var(--muted);letter-spacing:.04em}
.stage{position:relative;width:min(92vw,480px)}
.aura{position:absolute;inset:6% 4% 0;background:radial-gradient(closest-side,rgba(255,61,110,.5),rgba(255,61,110,0) 100%);filter:blur(30px);opacity:0;transition:opacity .25s;pointer-events:none}
svg{position:relative;display:block;width:100%;max-height:52vh}
.guide{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1.5}
.bulb{fill:url(#offG);stroke:rgba(255,255,255,.14);stroke-width:1.5;transition:fill .12s,stroke .12s}
.hl{fill:#fff;opacity:.28;transition:opacity .12s}
.glow{fill:var(--rose);opacity:0;transition:opacity .12s}
.core{fill:#fff4f0;opacity:0;transition:opacity .12s}
.on .bulb{fill:url(#onG);stroke:#ff9db4}
.on .hl{opacity:.8}
.on .glow{opacity:.95}
.on .core{opacity:.95}
.done .on .glow{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.controls{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2a1d24,#140d11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.5);transition:box-shadow .2s}
.ring.held{box-shadow:inset 0 0 0 1px rgba(255,120,150,.5),0 0 40px rgba(255,61,110,.35),0 10px 30px rgba(0,0,0,.5)}
.push{width:98px;height:98px;border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;font:600 .72rem/1 inherit;letter-spacing:.2em;text-transform:uppercase;background:radial-gradient(circle at 35% 28%,#ff7d9b,#f0245a 55%,#a50f38);box-shadow:0 7px 0 #6c0a25,0 14px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.35);transform:translateY(-4px);transition:transform .06s,box-shadow .06s;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.push.down{transform:translateY(3px);box-shadow:0 1px 0 #6c0a25,0 4px 10px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2)}
.push:focus-visible{outline:2px solid var(--fg);outline-offset:6px}
.count{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);letter-spacing:.12em}
.count b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<header>
<h1>Heart Lights</h1>
<p class="sub">Hold to build the light. Release to send it around.</p>
</header>
<div class="stage">
<div class="aura" id="aura"></div>
<svg id="heart" viewBox="-350 -270 700 620" role="img" aria-label="A heart made of light bulbs">
<defs>
<radialGradient id="offG" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#3b2e36"/><stop offset="1" stop-color="#161016"/></radialGradient>
<radialGradient id="onG" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff1f3"/><stop offset=".45" stop-color="#ff5b82"/><stop offset="1" stop-color="#d1194c"/></radialGradient>
<filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<path id="guide" class="guide"/>
<g id="bulbs"></g>
</svg>
</div>
<div class="controls">
<div class="ring" id="ring"><button id="go" class="push" aria-label="Hold to light the heart">Hold</button></div>
<div class="count"><b id="count">0</b> / 16 lit</div>
</div>
<script>
(function(){
var N=16, S=17.5, NS="http://www.w3.org/2000/svg";
function pt(t){return [16*Math.pow(Math.sin(t),3),13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)];}
var M=4000,pts=[],cum=[0],i,L=0;
for(i=0;i<=M;i++){pts.push(pt(i/M*2*Math.PI));}
for(i=1;i<=M;i++){L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);cum.push(L);}
var d="";
for(i=0;i<=M;i+=40){d+=(i?"L":"M")+(pts[i][0]*S).toFixed(1)+" "+(-pts[i][1]*S).toFixed(1);}
document.getElementById("guide").setAttribute("d",d+"Z");
var g=document.getElementById("bulbs"),bulbs=[];
for(i=0;i<N;i++){
  var target=i*L/N,j=0;
  while(cum[j]<target)j++;
  var p=pts[j],x=p[0]*S,y=-p[1]*S;
  var grp=document.createElementNS(NS,"g");
  grp.innerHTML='<circle class="glow" cx="'+x+'" cy="'+y+'" r="42" filter="url(#blur)"/><circle class="bulb" cx="'+x+'" cy="'+y+'" r="22"/><ellipse class="hl" cx="'+(x-7)+'" cy="'+(y-9)+'" rx="7" ry="4.4" transform="rotate(-35 '+(x-7)+' '+(y-9)+')"/><circle class="core" cx="'+x+'" cy="'+y+'" r="7.5"/>';
  g.appendChild(grp);bulbs.push(grp);
}
function bulbAt(o){return bulbs[(o+N/2)%N];}
var svg=document.getElementById("heart"),btn=document.getElementById("go"),ring=document.getElementById("ring"),aura=document.getElementById("aura"),countEl=document.getElementById("count");
var HOLD=250, RUN=130; // ms per bulb while held / while the group travels
var holding=false,head=N,tail=N,timer=null,lit=0;
function sync(){aura.style.opacity=Math.min(.85,lit/N*1.6);countEl.textContent=lit;}
function on(b){if(!b.classList.contains("on")){b.classList.add("on");lit++;sync();}}
function off(b){if(b.classList.contains("on")){b.classList.remove("on");lit--;sync();}}
function clearAll(){
  clearTimeout(timer);timer=null;
  bulbs.forEach(off);
  svg.classList.remove("done");
}
function holdTick(){
  if(!holding)return;
  if(head<N){on(bulbAt(head++));}
  if(head>=N){svg.classList.add("done");return;}
  timer=setTimeout(holdTick,HOLD);
}
function runTick(){
  // the lit group keeps its length: light the next bulb ahead, drop the one behind
  if(head<N){on(bulbAt(head++));}
  if(tail<N){off(bulbAt(tail++));}
  if(tail<N)timer=setTimeout(runTick,RUN);
}
function press(){
  if(holding)return;
  holding=true;clearAll();head=0;tail=0;
  btn.classList.add("down");ring.classList.add("held");
  on(bulbAt(head++));
  timer=setTimeout(holdTick,HOLD);
}
function release(){
  if(!holding)return;
  holding=false;btn.classList.remove("down");ring.classList.remove("held");
  clearTimeout(timer);svg.classList.remove("done");
  timer=setTimeout(runTick,RUN);
}
btn.addEventListener("pointerdown",function(e){e.preventDefault();try{btn.setPointerCapture(e.pointerId);}catch(err){}press();});
window.addEventListener("pointerup",release);
window.addEventListener("pointercancel",release);
btn.addEventListener("keydown",function(e){if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();press();}});
btn.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();release();}});
btn.addEventListener("blur",release);
btn.addEventListener("contextmenu",function(e){e.preventDefault();});
})();
</script>
</body>
</html>
